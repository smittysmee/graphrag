[project]
name = "graphrag"
version = "0.1.0"
description = "Persona-grounded Graph RAG on Neo4j, exposed as an MCP server and CLI for agentic use across the SDLC."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "smittysmee" }]
dependencies = [
    "fastmcp>=4.0.3,<5",
    "neo4j>=6.3.0,<7",
    "fastembed>=0.8.0,<0.9",
    "typer>=0.27.2,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pyyaml>=6.0.3,<7",
    "numpy>=2.5.3,<3",
    "pypdf>=6.18.0,<7",
    "anthropic>=1.4.0,<2",
    "rich>=15.0.0,<16",
    "httpx>=0.28.1,<1",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
graphrag = "graphrag.cli:app"
graphrag-mcp = "graphrag.mcp_server:main"
graphrag-embed-server = "graphrag.embed.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.6,<0.17",
    "mypy>=2.3.1,<3",
    "types-PyYAML>=6.0.12",
]
lsp = [
    "python-lsp-server>=1.15.0,<2",
    "pylsp-mypy>=0.8.0,<1",
    "python-lsp-ruff>=2.3.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "ANN",      # annotations
    "S",        # bandit
]
ignore = [
    "ANN401",   # Any in **kwargs is fine
    "S101",     # assert is fine in tests (also used in invariants)
    "S603", "S607",  # subprocess use is intentional in the CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["graphrag"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"
packages = ["graphrag"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live Neo4j (run via `make test-integration`)",
    "embedding: downloads/uses the real embedding model",
]
filterwarnings = ["error::DeprecationWarning:graphrag.*"]

[tool.coverage.run]
source = ["graphrag"]
branch = true
