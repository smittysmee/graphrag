# Alias map for the product-leader persona.
#
# Extraction keeps the spelling each passage uses, so one real thing arrives as several Entity
# nodes and every count over it is low by however many spellings nobody looked for. This table
# names the canonical spelling and the variants that fold into it.
#
# Built from the live graph, not from guesswork:
#
#   MATCH (e:Entity)<-[:MENTIONS]-(c:Chunk {persona_id:'product-leader'})
#   RETURN e.name, e.type, count(c) AS n ORDER BY n DESC
#
# then a mechanical sweep for names that collide once case, spacing, hyphens and punctuation are
# removed, a sweep for `The <title>` against `<title>`, and a sweep for singular against plural.
# Every group below was checked against those counts before it was written down.
#
# Rules this file follows:
#   - Same-thing only. A group is one company, one product, one person or one book.
#   - A product is kept apart from the company that makes it, even where the corpus uses one
#     word for both (Snap/Snapchat, OpenAI/ChatGPT, Anthropic/Claude, Vercel/v0).
#   - Matching is case-insensitive and whitespace-folded, so case-only and spacing-only variants
#     fold on their own; they are listed anyway only where the file reads better for it.
#   - Canonical spelling is the most-mentioned variant, except where a house spelling is
#     obviously right (37signals, monday.com, Tobi Lütke).
#   - Anything a reader could argue with goes in the `# review` block at the bottom, unmerged.
#
# What this table cannot do: two nodes with the *same* name and different types (Slack the
# company and Slack the product, Figma the company and Figma the product) are not spelling
# variants, and folding names cannot touch them. Leave them be, or fix the extraction.

aliases:
  # ---- companies: spacing, punctuation and house spelling ----
  37signals:
    - 37 Signals
  AngelList:
    - Angel List
  Athenahealth:
