# ---- review -------------------------------------------------------------------------------
# Candidates the sweeps surfaced that a person still has to rule on. Each one is a real pair in
# the graph; none is obvious enough to merge unasked. Move a line up into `aliases:` once it is
# settled, or delete it once it is settled the other way.
#
#   Meta / Facebook              — one company renamed, but the corpus also says "Facebook" for
#                                  the product and for the pre-2021 era. Merging loses that.
#   Square / Block               — same rename problem, and Square is also a product name.
#   Snap / Snapchat              — company and product, usually; sometimes used interchangeably.
#   Bard / Gemini                — renamed model. Passages about Bard are about the old one.
#   Codeium / Windsurf           — renamed company. Same question as Bard.
#   Copilot / GitHub Copilot     — "Copilot" is also Microsoft Copilot in some passages.
#   GPT / GPTs                   — the model family against the custom-GPT feature. Not one thing.
#   Lean Startup / The Lean Startup — the method (33 mentions) against the book (1).
#   crux / The Crux              — the concept against Rumelt's book of the same name.
#   messy middle / The Messy Middle — same shape as above.
#   Rick, Cal, Tal, Tim, Chris,  — first names shared by several people in the corpus. "Rick"
#     Patrick, Jason, Steve,       alone can be Rick Rubin, Rick Dalzell or Rick Song.
#     David, Brian, Eric
#   Boz / Bos                    — two spellings of one nickname, but no full-name node exists
#                                  to make canonical yet.
#   Dara, Eren, Travis           — short forms whose full-name node is missing from the graph.
