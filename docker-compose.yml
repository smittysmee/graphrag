# Everything runs in Docker. Profiles:
#   (default) neo4j + graphrag (MCP server on :8765)
#   dev       one-shot quality/test runner, LSP
#   test      throwaway Neo4j (tmpfs) for integration tests
#   embed     standalone embedding server on :8766 (run this on the GB10)
name: graph-rag

x-app-env: &app-env
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag-local-password}
  GRAPHRAG_EMBEDDING_BACKEND: ${GRAPHRAG_EMBEDDING_BACKEND:-fastembed}
  GRAPHRAG_EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  GRAPHRAG_EMBEDDING_DIM: ${GRAPHRAG_EMBEDDING_DIM:-384}
  GRAPHRAG_EMBEDDING_BASE_URL: ${GRAPHRAG_EMBEDDING_BASE_URL:-}
  GRAPHRAG_EMBEDDING_API_KEY: ${GRAPHRAG_EMBEDDING_API_KEY:-}
  GRAPHRAG_EMBEDDING_CUDA: ${GRAPHRAG_EMBEDDING_CUDA:-false}
  GRAPHRAG_MCP_HOST: 0.0.0.0
  GRAPHRAG_MCP_PORT: ${GRAPHRAG_MCP_PORT:-8765}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GRAPHRAG_ENRICH_MODEL: ${GRAPHRAG_ENRICH_MODEL:-claude-opus-5}

x-app-volumes: &app-volumes
  - ./data:/app/data
  - ./personas:/app/personas
  - ./.claude:/app/.claude     # `graphrag setup` writes persona skills here
  - models:/models

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphrag-local-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  graphrag:
    build:
      context: .
      target: runtime
    image: graphrag:local
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    ports:
      - "${GRAPHRAG_MCP_PORT:-8765}:8765"
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["graphrag", "serve", "--transport", "http"]

  # ------------------------------------------------------------ dev tooling
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: graphrag:dev
    environment:
      <<: *app-env
      GRAPHRAG_EMBEDDING_BACKEND: ${GRAPHRAG_EMBEDDING_BACKEND:-fastembed}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./Makefile:/app/Makefile
      - ./data:/app/data
      - ./personas:/app/personas
      - ./docs:/app/docs
      - ./.claude:/app/.claude
      - models:/models
    command: ["make", "check-local"]

  lsp:
    profiles: ["dev"]
    image: graphrag:dev
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    stdin_open: true
    command: ["pylsp"]

  # ------------------------------------------------------------ integration tests
  neo4j-test:
    profiles: ["test"]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  test:
    profiles: ["test"]
    image: graphrag:dev
    build:
      context: .
      target: dev
    environment:
      <<: *app-env
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_PASSWORD: testpassword
      GRAPHRAG_EMBEDDING_BACKEND: hash
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./Makefile:/app/Makefile
      - ./personas:/app/personas
      - models:/models
    depends_on:
      neo4j-test:
        condition: service_healthy
    command: ["make", "test-integration-local"]

  # ------------------------------------------------------------ embedding server (GB10)
  embed:
    profiles: ["embed"]
    image: graphrag:local
    build:
      context: .
      target: runtime
      args:
        EMBED_GPU: ${EMBED_GPU:-0}
    environment:
      GRAPHRAG_EMBEDDING_BACKEND: fastembed
      GRAPHRAG_EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      GRAPHRAG_EMBEDDING_DIM: ${GRAPHRAG_EMBEDDING_DIM:-384}
      GRAPHRAG_EMBEDDING_CUDA: ${GRAPHRAG_EMBEDDING_CUDA:-false}
      GRAPHRAG_EMBED_SERVER_HOST: 0.0.0.0
      GRAPHRAG_EMBED_SERVER_PORT: 8766
    ports:
      - "${GRAPHRAG_EMBED_SERVER_PORT:-8766}:8766"
    volumes:
      - models:/models
    command: ["graphrag-embed-server"]

volumes:
  neo4j_data:
  models:
